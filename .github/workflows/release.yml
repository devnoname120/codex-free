name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

      - name: Test
        run: bun test

      - name: Package
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          tar czf "codex-free-${VERSION}.tar.gz" \
            --exclude=node_modules \
            --exclude=.git \
            --exclude=docs \
            --exclude=dist \
            .
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "ARCHIVE=codex-free-${VERSION}.tar.gz" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ env.ARCHIVE }}
